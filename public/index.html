<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E4D3E">
<meta name="color-scheme" content="light">
<title>Kitchen Ledger</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="signin" class="signin" hidden>
  <div class="signin__card">
    <p class="eyebrow">Kitchen Ledger</p>
    <h1 class="signin__title">Two plans,<br>one kitchen.</h1>
    <label class="field">
      <span>Username</span>
      <input id="lg-user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
    </label>
    <label class="field">
      <span>Password</span>
      <input id="lg-pass" type="password" autocomplete="current-password">
    </label>
    <button id="lg-go" class="btn btn--primary">Sign in</button>
    <p id="lg-err" class="err" hidden></p>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="top__row">
      <p class="eyebrow" id="top-eyebrow">Kitchen Ledger</p>
      <button id="signout" class="linkbtn">Sign out</button>
    </div>
    <div id="ledger" class="ledger"></div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabs" role="tablist">
    <button class="tab" data-view="today" role="tab">Today</button>
    <button class="tab" data-view="week" role="tab">Week</button>
    <button class="tab" data-view="recipes" role="tab">Recipes</button>
    <button class="tab" data-view="shop" role="tab">Shop</button>
    <button class="tab" data-view="progress" role="tab">Progress</button>
  </nav>
</div>

<div id="toast" class="toast" hidden></div>

<script src="/app.js"></script>
</body>
</html>
