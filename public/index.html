<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4EEE5">
<meta name="color-scheme" content="light">
<title>Kitchen Ledger</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/style.css?v=3">
</head>
<body>

<div id="signin" class="signin" hidden>
  <div class="signin__card">
    <span class="eyebrow-pill">Kitchen Ledger</span>
    <h1 class="signin__title">Two plans,<br>one kitchen.</h1>
    <p class="signin__sub">Sign in to log today's meals and see the plan.</p>
    <label class="field">
      <span>Username</span>
      <input id="lg-user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
    </label>
    <label class="field">
      <span>Password</span>
      <input id="lg-pass" type="password" autocomplete="current-password">
    </label>
    <button id="lg-go" class="btn btn--primary">Sign in</button>
    <p id="lg-err" class="err" hidden></p>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="top__row">
      <span class="eyebrow-pill" id="top-eyebrow">Kitchen Ledger</span>
      <button id="signout" class="iconbtn" aria-label="Sign out" title="Sign out">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 4h-2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 12h10m0 0-3-3m3 3-3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div id="ledger" class="ledger"></div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabs" role="tablist">
    <button class="tab" data-view="today" role="tab">
      <span class="tab__icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M5.6 18.4l1.6-1.6M16.8 7.2l1.6-1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
      <span class="tab__label">Today</span>
    </button>
    <button class="tab" data-view="week" role="tab">
      <span class="tab__icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="16" rx="4" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 9.5h17" stroke="currentColor" stroke-width="1.8"/><path d="M8 3v3M16 3v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
      <span class="tab__label">Week</span>
    </button>
    <button class="tab" data-view="recipes" role="tab">
      <span class="tab__icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 11h16a8 8 0 0 1-16 0Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 11c0-2.5 1-4 3-4s3 1.5 3 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M8 19h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
      <span class="tab__label">Recipes</span>
    </button>
    <button class="tab" data-view="shop" role="tab">
      <span class="tab__icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 4h2l1.6 10.2A2 2 0 0 0 8.6 16H17a2 2 0 0 0 2-1.6L20.5 7H6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9.5" cy="20" r="1.4" fill="currentColor"/><circle cx="17" cy="20" r="1.4" fill="currentColor"/></svg></span>
      <span class="tab__label">Shop</span>
    </button>
    <button class="tab" data-view="progress" role="tab">
      <span class="tab__icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 16l5-5 4 4 7-8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 6h5v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="tab__label">Progress</span>
    </button>
  </nav>
</div>

<div id="toast" class="toast" hidden></div>

<script src="/app.js?v=3"></script>
</body>
</html>
